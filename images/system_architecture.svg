<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1710 500" width="1710" height="500" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="1710" height="500" fill="#0a0e17"/>

  <!-- Title -->
  <text x="46" y="52" font-size="30" font-weight="700" fill="#ffffff">🏗️ System Architecture</text>
  <line x1="46" y1="78" x2="1664" y2="78" stroke="#242c3d" stroke-width="1.5"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8aa8"/>
    </marker>
  </defs>

  <!-- Row 1: Daily pipeline -->
  <!-- Node template: rect + centered text -->
  <g font-size="17" fill="#e6e9f2">
    <rect x="40" y="150" width="190" height="60" rx="8" fill="#111726" stroke="#3a4257" stroke-width="1.5"/>
    <text x="135" y="185" text-anchor="middle">Yahoo Finance API</text>

    <rect x="330" y="150" width="200" height="60" rx="8" fill="#111726" stroke="#3a4257" stroke-width="1.5"/>
    <text x="430" y="178" text-anchor="middle">data/*.csv</text>
    <text x="430" y="198" text-anchor="middle" font-size="13" fill="#8b93a8">(committed in repo)</text>

    <rect x="630" y="150" width="240" height="60" rx="8" fill="#111726" stroke="#3a4257" stroke-width="1.5"/>
    <text x="750" y="178" text-anchor="middle">Bi-LSTM + SARIMAX</text>
    <text x="750" y="198" text-anchor="middle" font-size="13" fill="#8b93a8">Inference</text>

    <rect x="970" y="150" width="210" height="60" rx="8" fill="#111726" stroke="#3a4257" stroke-width="1.5"/>
    <text x="1075" y="185" text-anchor="middle">predictions.json</text>

    <rect x="1280" y="150" width="200" height="60" rx="8" fill="#111726" stroke="#22c55e" stroke-width="2"/>
    <text x="1380" y="178" text-anchor="middle" fill="#22c55e">git commit + push</text>
    <text x="1380" y="198" text-anchor="middle" font-size="13" fill="#8b93a8">GitHub Actions</text>
  </g>

  <!-- arrows row 1 -->
  <g stroke="#7d8aa8" stroke-width="1.5" fill="none">
    <line x1="230" y1="180" x2="325" y2="180" marker-end="url(#arrow)"/>
    <line x1="530" y1="180" x2="625" y2="180" marker-end="url(#arrow)"/>
    <line x1="870" y1="180" x2="965" y2="180" marker-end="url(#arrow)"/>
    <line x1="1180" y1="180" x2="1275" y2="180" marker-end="url(#arrow)"/>
  </g>
  <g font-size="13" fill="#8b93a8">
    <text x="278" y="170" text-anchor="middle">daily ingest</text>
    <text x="578" y="170" text-anchor="middle">load</text>
    <text x="918" y="170" text-anchor="middle">forecast</text>
    <text x="1228" y="170" text-anchor="middle">save</text>
  </g>

  <!-- GitHub repo node (center hub) -->
  <rect x="730" y="330" width="240" height="70" rx="8" fill="#111726" stroke="#06b6d4" stroke-width="2"/>
  <text x="850" y="362" text-anchor="middle" font-size="18" fill="#06b6d4" font-weight="700">GitHub Repo</text>
  <text x="850" y="384" text-anchor="middle" font-size="13" fill="#8b93a8">data/ + models/ (source of truth)</text>

  <!-- arrow from push node down to repo -->
  <path d="M1380,210 L1380,365 L975,365" stroke="#7d8aa8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Weekly retrain branch (left) -->
  <g font-size="17" fill="#e6e9f2">
    <rect x="40" y="330" width="260" height="70" rx="8" fill="#111726" stroke="#8b5cf6" stroke-width="2"/>
    <text x="170" y="360" text-anchor="middle" fill="#8b5cf6" font-weight="700">Weekly Retrain</text>
    <text x="170" y="382" text-anchor="middle" font-size="13" fill="#8b93a8">Bi-LSTM + SARIMAX (Sun cron)</text>
  </g>
  <path d="M730,365 L300,365" stroke="#7d8aa8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="515" y="355" text-anchor="middle" font-size="13" fill="#8b93a8">weekly cron trigger</text>

  <path d="M170,330 L170,270 L730,270 L730,365" stroke="#7d8aa8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="450" y="260" text-anchor="middle" font-size="13" fill="#8b93a8">git push models/*.keras + *.pkl</text>

  <!-- Streamlit Dashboard (right) -->
  <rect x="1360" y="330" width="270" height="70" rx="8" fill="#111726" stroke="#eab308" stroke-width="2"/>
  <text x="1495" y="362" text-anchor="middle" font-size="18" fill="#eab308" font-weight="700">Streamlit Dashboard</text>
  <text x="1495" y="384" text-anchor="middle" font-size="13" fill="#8b93a8">reads data/ files directly</text>

  <path d="M970,365 L1355,365" stroke="#7d8aa8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1163" y="355" text-anchor="middle" font-size="13" fill="#8b93a8">auto-redeploy on push</text>

  <!-- Footer note -->
  <text x="46" y="470" font-size="14" fill="#6b7385">No server, database, or backend to keep alive — GitHub Actions runs the pipeline, Streamlit Community Cloud reads the committed files.</text>
</svg>
